# Alembic configuration for services/resume-api.
# NOTE: `sqlalchemy.url` below is only a placeholder -- the real value is injected by
# alembic/env.py from the DATABASE_URL environment variable.
# NOTE: keep this file ASCII-only. Alembic reads it with the platform default codec
# (cp936 on this Windows box), so non-ASCII comments raise UnicodeDecodeError.
# Always run alembic from the services/resume-api directory (or pass -c <this file>).

[alembic]
script_location = alembic
version_path_separator = os
# The 0001 baseline freezes every table left behind by Drizzle; from there on the
# Python side (Alembic) owns schema evolution.
# WARNING: never run autogenerate/upgrade against the live database -- verify on a temp DB.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
